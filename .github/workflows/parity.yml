name: Inference parity

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Test without Hub support or checkpoints
        run: cargo test --locked --workspace --no-default-features

  hub-parity:
    name: Hub parity (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [5m, 28m, 123m, 209m]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the CPU reference
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.15.0'
          python -m pip install 'numpy==2.5.5' 'timestral @ git+https://github.com/mistralai/timestral.git@a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff'
      - name: Generate and compare forecasts on the same runner
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
          BURN_DEVICE: flex
        run: |
          printf 'Runner image: %s (%s)\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          lscpu
          rustc -Vv
          export TIMESTRAL_MODEL_DIR="$RUNNER_TEMP/timestral-model"
          export TIMESTRAL_PARITY_FIXTURE="$RUNNER_TEMP/timestral-reference.json"
          python crates/burn-timestral/tools/generate_parity_fixtures.py \
            --variant "${VARIANT^^}" --download-checkpoint "$TIMESTRAL_MODEL_DIR" \
            --out "$TIMESTRAL_PARITY_FIXTURE"
          cargo test --locked --package burn-timestral --release --test test_inference_parity \
            "test_parity_$VARIANT" -- --ignored --exact --nocapture
      - name: Run additional pretrained integration tests
        if: matrix.variant == '209m'
        run: cargo test --locked --package burn-timestral --release --lib -- --ignored --test-threads=1