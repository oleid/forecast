[package]
name = "timestral-cli"
version = "0.1.0"
edition = "2024"

[features]
default = ["hub"]
hub = ["forecast-pipeline/hub"]
wgpu = ["forecast-pipeline/wgpu"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
forecast-pipeline = {
    path = "../forecast-pipeline",
    default-features = false,
    features = ["csv", "postgres", "influx3"],
}
plotly = { version = "0.14", features = ["plotly_embed_js"] }
serde_json = "1.0"