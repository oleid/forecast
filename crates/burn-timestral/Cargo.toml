[package]
name = "burn-timestral"
version = "0.1.0"
edition = "2024"

[features]
default = ["hub"]
hub = ["dep:hf-hub"]
wgpu = ["burn/wgpu"]

[dependencies]
burn = { version = "0.22", features = ["flex"] }
burn-store = { version = "0.22", default-features = false, features = ["std", "safetensors"] }
csv = "1.4"
forecast-core = { path = "../forecast-core" }
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

[dev-dependencies]
tempfile = "3"